# Frontend service to add to your existing compose.yaml
# Usage: docker compose -f compose.yaml -f docker-compose.frontend.yaml up

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://via-server:9001
    depends_on:
      - via-server
    restart: unless-stopped
